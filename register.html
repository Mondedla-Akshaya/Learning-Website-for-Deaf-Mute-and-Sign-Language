<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Learning Sign</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-4xl font-bold text-center mb-8">Create Account</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" class="w-full p-5 border rounded-2xl mb-5 text-xl" required>
            
            <!-- Gender -->
            <div class="mb-5">
                <label class="block text-lg font-medium text-gray-700 mb-3">Gender</label>
                <select name="gender" class="w-full p-5 border rounded-2xl text-xl" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Non-binary">Non-binary</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>

            <!-- Hearing & Speech Condition -->
            <div class="mb-8">
                <label class="block text-lg font-medium text-gray-700 mb-3">Hearing & Speech Condition</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center gap-3 p-4 border rounded-2xl cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="condition" value="deaf" class="w-6 h-6 accent-indigo-600" required>
                        <span class="text-xl">Deaf</span>
                    </label>
                    
                    <label class="flex items-center gap-3 p-4 border rounded-2xl cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="condition" value="mute" class="w-6 h-6 accent-indigo-600">
                        <span class="text-xl">Mute</span>
                    </label>
                    
                    <label class="flex items-center gap-3 p-4 border rounded-2xl cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="condition" value="both" class="w-6 h-6 accent-indigo-600">
                        <span class="text-xl">Both</span>
                    </label>
                    
                    <label class="flex items-center gap-3 p-4 border rounded-2xl cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="condition" value="none" class="w-6 h-6 accent-indigo-600">
                        <span class="text-xl">None</span>
                    </label>
                </div>
            </div>

            <input type="password" name="password" placeholder="Password" class="w-full p-5 border rounded-2xl mb-8 text-xl" required>
            
            <button type="submit" class="w-full bg-indigo-600 text-white py-5 rounded-3xl text-2xl font-semibold">Register</button>
        </form>
        <p class="text-center mt-6">Already have account? <a href="/login" class="text-indigo-600">Login here</a></p>
    </div>
</body>
</html>
