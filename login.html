<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learning Sign</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-4xl font-lbold text-center mb-8">Welcome Back</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username or Email" class="w-full p-5 border rounded-2xl mb-5 text-xl" required>
            <input type="password" name="password" placeholder="Password" class="w-full p-5 border rounded-2xl mb-8 text-xl" required>
            <button type="submit" class="w-full bg-indigo-600 text-white py-5 rounded-3xl text-2xl font-semibold">Login</button>
        </form>
        <p class="text-center mt-6">New user? <a href="/register" class="text-indigo-600">Register here</a></p>
    </div>
</body>
</html>
